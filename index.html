<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Epistemological Civ Tree</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg: #0c1016; --panel: #151a22; --panel-glass: rgba(21,26,34,.96); --line: #303847; --text: #e0e3e8; --muted: #9199a7;
    --knowledge: #2a3446; --state: #23384a; --gateway: #d4a63a; --pressure: #4a2f2f; --attractor: #3b2f5c;
    --forward: #4f8fe8; --unlock: #7fc1ff; --lateral: #7b8595; --defeater: #e0534f; --feedback: #b47cff;
    --backward: #f0963c; --reinterpretation: #3ec9b8; --global_modifier: #6d7a8c; --hl: #ffe066;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font: 13px/1.4 system-ui, sans-serif; }
  #app { display: flex; flex-direction: column; height: 100dvh; }
  #bar { z-index: 4; min-height: 48px; display: flex; align-items: center; gap: 6px; padding: 7px 10px; background: #11161d; border-bottom: 1px solid var(--line); }
  #bar h1 { margin: 0 auto 0 2px; white-space: nowrap; color: #eee7d8; font: 600 17px/1.1 Georgia, serif; }
  #bar .group { display: flex; align-items: center; gap: 4px; }
  #viewport { position: relative; flex: 1; min-height: 0; overflow: hidden; }
  aside { position: absolute; z-index: 3; top: 8px; bottom: 8px; width: min(320px, calc(100% - 24px)); background: var(--panel-glass); border: 1px solid var(--line); overflow: auto; padding: 14px; box-shadow: 0 12px 40px #0008; transition: transform .18s ease; }
  #left { left: 8px; transform: translateX(calc(-100% - 12px)); } #left.open { transform: none; }
  #right { right: 8px; width: min(380px, calc(100% - 24px)); transform: translateX(calc(100% + 12px)); } #right.open { transform: none; }
  h1 { font: 600 18px/1.2 Georgia, serif; margin: 0 0 8px; } h2 { font-size: 12px; letter-spacing: .02em; color: var(--muted); margin: 14px 0 6px; }
  label.f { display: block; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  input[type=search], select { width: 100%; background: #0c1016; color: var(--text); border: 1px solid var(--line); border-radius: 4px; padding: 7px; }
  #bar input[type=search] { width: clamp(150px, 24vw, 310px); }
  button { background: #202735; color: var(--text); border: 1px solid var(--line); border-radius: 4px; padding: 6px 9px; cursor: pointer; }
  button:hover, button[aria-pressed=true] { background: #313b4e; border-color: #59677e; }
  button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--hl); outline-offset: 2px; }
  .close { float: right; margin: -4px -4px 0 8px; }
  .sw { display: inline-block; width: 22px; height: 0; border-top: 3px solid; vertical-align: middle; margin-right: 6px; }
  .pill { display: inline-block; padding: 1px 6px; border-radius: 10px; background: #222938; margin: 1px 2px; cursor: pointer; font-size: 12px; }
  .pill:hover { background: #2f3a50; }
  .neg { color: var(--defeater); } .pos { color: var(--forward); }
  #right p { margin: 6px 0; } #right .k { color: var(--muted); }
  svg { width: 100%; height: 100%; display: block; background: radial-gradient(circle at 30% 25%, #18202c 0, var(--bg) 48%); touch-action: none; }
  .lane { fill: #ffffff; fill-opacity: .025; stroke: var(--line); }
  .lane:nth-child(even) { fill-opacity: .05; }
  .laneLabel { fill: var(--muted); font-size: 12px; letter-spacing: .04em; }
  .stageSub { fill: var(--muted); font-size: 11px; }
  .axis text { font-size: 12px; paint-order: stroke; stroke: var(--bg); stroke-width: 4px; stroke-linejoin: round; }
  .axis .stageAxis { font: 600 13px Georgia, serif; fill: #ddd6c8; }
  .axis .laneAxis { fill: var(--muted); }
  .axisBand { fill: #11161d; fill-opacity: .92; }
  .colLine { stroke: var(--line); stroke-dasharray: 2 6; }
  .rail { fill: none; stroke: var(--line); stroke-dasharray: 6 4; }
  .edge { fill: none; opacity: .18; pointer-events: stroke; }
    .edge.lit { opacity: 1; } .edge.dim { opacity: .025; }
  #root .edge.global_modifier:not(.lit) { opacity: 0; } /* rail edges span the whole map; show only in context */
  .edge.hidden { display: none; }
  .node { cursor: pointer; } .node.dim { opacity: .11; } .node.prerequisite rect { stroke: var(--backward); } .node.consequence rect { stroke: var(--unlock); } .node.hidden { display: none; }
  .node rect { stroke-width: 1.5; }
  .node.knowledge rect { fill: var(--knowledge); stroke: #4a5670; }
  .node.state rect { fill: var(--state); stroke: #6aa4d8; stroke-width: 2; }
  .node.gateway rect { fill: #2b2a1e; stroke: var(--gateway); stroke-width: 2.5; }
  .node.pressure rect { fill: var(--pressure); stroke: #d07a6a; stroke-dasharray: 5 3; }
  .node.attractor rect { fill: var(--attractor); stroke: #c9b2ff; stroke-width: 2.5; }
  .node.global rect { fill: #1d2a2a; stroke: #6fb3a5; }
  .node.isAttractor rect { filter: drop-shadow(0 0 8px #c9b2ff); }
  .node.selected rect { stroke: var(--hl); stroke-width: 3; }
  .node:focus { outline: none; } .node:focus rect { stroke: #fff; stroke-width: 3; filter: drop-shadow(0 0 5px var(--hl)); }
  .node.match rect { stroke: var(--hl); }
  .node text { fill: var(--text); font-size: 11.5px; pointer-events: none; }
  .node .role { fill: var(--muted); font-size: 10px; }
  .node .key { fill: var(--gateway); font-size: 12px; }
  #root.overview .edge:not(.feedback) { opacity: 0; pointer-events: none; }
  #root.overview .node:not(.gateway):not(.attractor):not(.isAttractor) { opacity: .45; pointer-events: none; }
  #root.overview .node:not(.gateway):not(.attractor):not(.isAttractor) text { display: none; }
  #root.overview .edge.feedback { opacity: .25; }
  #root.mid .node .role { display: none; } #root.mid .edge { opacity: .1; } #root.mid .edge.lit { opacity: 1; }
  #status { position: absolute; z-index: 2; bottom: 10px; left: 50%; max-width: min(680px, calc(100% - 24px)); transform: translateX(-50%); padding: 5px 9px; color: #c2c8d1; background: #0c1016d9; border: 1px solid var(--line); border-radius: 4px; font-size: 12px; pointer-events: none; }
  #status:empty { display: none; }
  @media (max-width: 820px) {
    #bar { flex-wrap: wrap; } #bar h1 { order: -1; width: 100%; margin: 0; text-align: center; } #bar input[type=search] { order: 2; width: 100%; }
    #bar .camera { margin-left: auto; } .optional { display: none; }
  }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; } }
</style>
</head>
<body>
<div id="app">
  <header id="bar">
    <button id="filtersToggle" aria-controls="left" aria-expanded="false">Filters</button>
    <h1>Epistemological Strategy Atlas</h1>
    <input id="search" type="search" aria-label="Search concepts" placeholder="Search concepts…">
    <div class="group camera" aria-label="Camera controls">
      <button id="home" title="Focus early stages">Home</button><button id="fitAll">Fit all</button><button id="fitSelection" class="optional">Fit selection</button>
    </div>
    <button id="route" aria-pressed="false">Route</button>
    <button id="inspectorToggle" aria-controls="right" aria-expanded="false">Inspector</button>
  </header>
  <main id="viewport">
  <aside id="left" aria-label="Map filters" aria-hidden="true" inert>
    <button class="close" data-close="left" aria-label="Close filters">×</button><h1>Map controls</h1>
    <h2>Highlight cycle or trace</h2>
    <label for="cycle">Cycle or trace</label><select id="cycle"><option value="">— none —</option></select>
    <div id="cycleDesc" style="color:var(--muted);margin-top:4px"></div>
    <button id="clear">Clear highlights</button>
    <h2>Edge classes</h2><div id="edgeFilters"></div>
    <h2>Stages</h2><div id="stageFilters"></div>
    <h2>Layers</h2><div id="layerFilters"></div>
    <h2>Node roles</h2>
    <div id="roleLegend"></div>
  </aside>
  <svg id="canvas" role="application" aria-label="Interactive epistemological strategy map"><defs id="defs"></defs><g id="root"></g><g class="axis" id="axes" aria-hidden="true"></g></svg>
  <aside id="right" aria-label="Concept inspector" aria-hidden="true" inert><button class="close" data-close="right" aria-label="Close inspector">×</button><h1>Inspector</h1><div id="inspector" style="color:var(--muted)">Select a concept.</div></aside>
  <div id="status" role="status" aria-live="polite"></div>
  </main>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script>
(async function () {
  const D = await (await fetch('epistemological_civ_tree_final.json')).json();
  const nodes = D.nodes, edges = D.edges, byId = new Map(nodes.map(n => [n.id, n]));
  const stages = D.progression.stages, layers = D.graph.layers;
  const attractorIds = new Set(D.attractors.map(a => a.node_id));
  const edgeClasses = [...new Set(edges.map(e => e.transitionClass))];
  const roles = [...new Set(nodes.map(n => n.progressionRole))];
  const cssVar = k => getComputedStyle(document.documentElement).getPropertyValue('--' + k).trim();

  // ---------- layout: deterministic stage columns × layer lanes, 2-wide grid inside cells ----------
  const NW = 168, NH = 50, GX = 12, GY = 12, COLW = 2 * NW + 3 * GX + 40, LEFT = 150, TOP = 70, RAILH = 90;
  const cells = d3.group(nodes.filter(n => n.stageScope !== 'global'), n => n.layer, n => n.stage);
  const laneH = new Map(), laneY = new Map();
  let y = TOP + RAILH;
  for (const L of layers) {
    const maxN = d3.max([...(cells.get(L)?.values() ?? [])], v => v.length) ?? 0;
    const h = Math.max(1, Math.ceil(maxN / 2)) * (NH + GY) + GY + 18;
    laneY.set(L, y); laneH.set(L, h); y += h;
  }
  const bottomRailY = y + 20, totalH = bottomRailY + RAILH;
  const colX = s => LEFT + s * COLW;
  const totalW = LEFT + stages.length * COLW;
  for (const [L, byStage] of cells) for (const [s, list] of byStage) {
    list.sort((a, b) => (roleRank(b) - roleRank(a)) || a.label.localeCompare(b.label));
    list.forEach((n, i) => { n.x = colX(s) + GX + 20 + (i % 2) * (NW + GX); n.y = laneY.get(L) + 18 + GY + Math.floor(i / 2) * (NH + GY); });
  }
  function roleRank(n) { return { attractor: 4, gateway: 3, state: 2, pressure: 1, knowledge: 0 }[n.progressionRole] ?? 0; }
  // global rails: human_experience on top, everything else on bottom
  const topG = nodes.filter(n => n.stageScope === 'global' && n.layer === 'human_experience');
  const botG = nodes.filter(n => n.stageScope === 'global' && n.layer !== 'human_experience');
  const spread = (list, yy) => list.forEach((n, i) => { n.x = LEFT + 40 + i * ((totalW - LEFT - 80 - NW) / Math.max(1, list.length - 1)); n.y = yy; });
  spread(topG, TOP + 20); spread(botG, bottomRailY + 20);
  nodes.forEach(n => { n.cx = n.x + NW / 2; n.cy = n.y + NH / 2; });

  // ---------- edge geometry ----------
  function path(e) {
    const s = byId.get(e.source), t = byId.get(e.target);
    if (s.stageScope === 'global' || t.stageScope === 'global') {
      const ay = s.cy < t.cy ? s.y + NH : s.y, by = s.cy < t.cy ? t.y : t.y + NH; // vertical drop from rail
      return `M${s.cx},${ay} C${s.cx},${(ay + by) / 2} ${t.cx},${(ay + by) / 2} ${t.cx},${by}`;
    }
    const dx = t.x - s.x;
    if (Math.abs(dx) < NW) { // lateral: loop out the right side
      const o = 40 + Math.abs(t.cy - s.cy) * 0.08;
      return `M${s.x + NW},${s.cy} C${s.x + NW + o},${s.cy} ${t.x + NW + o},${t.cy} ${t.x + NW},${t.cy}`;
    }
    if (dx > 0) { // forward S-curve
      const m = (s.x + NW + t.x) / 2;
      return `M${s.x + NW},${s.cy} C${m},${s.cy} ${m},${t.cy} ${t.x},${t.cy}`;
    }
    // backward arc: supportive above, counter-pressure below; height grows with stage span
    const up = e.weight >= 0, h = 70 + Math.abs(dx) * 0.16;
    const y0 = up ? Math.min(s.y, t.y) - h : Math.max(s.y, t.y) + NH + h;
    const sy = up ? s.y : s.y + NH, ty = up ? t.y : t.y + NH;
    return `M${s.cx},${sy} C${s.cx},${y0} ${t.cx},${y0} ${t.cx},${ty}`;
  }

  // ---------- render ----------
  const svg = d3.select('#canvas'), root = d3.select('#root'), defs = d3.select('#defs');
  for (const c of [...edgeClasses, 'hl']) defs.append('marker').attr('id', 'arr-' + c).attr('viewBox', '0 -4 8 8').attr('refX', 8).attr('markerWidth', 7).attr('markerHeight', 7).attr('orient', 'auto')
    .append('path').attr('d', 'M0,-4L8,0L0,4Z').attr('fill', cssVar(c));

  // lanes + stage columns
  const bg = root.append('g');
  for (const L of layers) {
    bg.append('rect').attr('class', 'lane').attr('x', 0).attr('y', laneY.get(L)).attr('width', totalW).attr('height', laneH.get(L));
  }
  for (const s of stages) {
    bg.append('line').attr('class', 'colLine').attr('x1', colX(s.id)).attr('x2', colX(s.id)).attr('y1', TOP + RAILH).attr('y2', bottomRailY);
    wrap(s.description, 58, 2).forEach((line, i) => bg.append('text').attr('class', 'stageSub').attr('x', colX(s.id) + 20).attr('y', TOP - 26 + i * 14).text(line));
  }
  for (const [yy, label] of [[TOP, 'Global pressures · human experience'], [bottomRailY, 'Global pressures · social / meta']]) {
    bg.append('rect').attr('class', 'rail').attr('x', LEFT).attr('y', yy).attr('width', totalW - LEFT).attr('height', RAILH - 10).attr('rx', 8);
    bg.append('text').attr('class', 'laneLabel').attr('x', LEFT + 10).attr('y', yy + 14).text(label);
  }

  const edgeSel = root.append('g').selectAll('path').data(edges).join('path')
    .attr('class', e => 'edge ' + e.transitionClass).attr('d', path)
    .attr('stroke', e => cssVar(e.transitionClass)).attr('stroke-width', e => 0.8 + Math.abs(e.weight) * 3)
    .attr('stroke-dasharray', e => ({ reinterpretation: '8 5', feedback: '2 4', global_modifier: '1 4' })[e.transitionClass] ?? null)
    .attr('marker-end', e => `url(#arr-${e.transitionClass})`)
    .on('mouseenter', (ev, e) => status(`${byId.get(e.source).label} → ${byId.get(e.target).label} · ${e.transitionClass} · ${e.type} · w ${e.weight.toFixed(2)}${e.label ? ' · ' + e.label : ''}`))
    .on('mouseleave', () => status(standingStatus));

  const nodeSel = root.append('g').selectAll('g').data(nodes).join('g')
    .attr('class', n => `node ${n.progressionRole}${n.stageScope === 'global' ? ' global' : ''}${attractorIds.has(n.id) ? ' isAttractor' : ''}`)
    .attr('transform', n => `translate(${n.x},${n.y})`)
    .attr('tabindex', 0).attr('role', 'button')
    .attr('aria-label', n => `${n.label}, ${n.progressionRole}, ${n.stageScope === 'global' ? 'global' : `stage ${n.stage}`}`)
    .on('click', (ev, n) => activateNode(n, ev.shiftKey))
    .on('keydown', keyNode)
    .on('mouseenter', (ev, n) => { if (!mode && !selected) light(new Set([n.id]), touching(n.id)); })
    .on('mouseleave', () => { if (!mode && !selected) unlight(); });
  nodeSel.append('rect').attr('width', NW).attr('height', NH).attr('rx', n => n.progressionRole === 'state' ? NH / 2 : 5);
  nodeSel.each(function (n) { wrap(n.label, 25, 2).forEach((line, i) => d3.select(this).append('text').attr('x', 8).attr('y', 17 + i * 13).text(line)); });
  // knowledge is the default role (50 of 92 nodes); only name the exceptions
  nodeSel.append('text').attr('class', 'role').attr('x', 8).attr('y', 43).text(n => [n.progressionRole === 'knowledge' ? '' : n.progressionRole, n.stageScope === 'global' ? 'global' : '', attractorIds.has(n.id) && n.progressionRole !== 'attractor' ? 'attractor' : ''].filter(Boolean).join(' · '));
  nodeSel.filter(n => n.progressionRole === 'gateway').append('text').attr('class', 'key').attr('x', NW - 18).attr('y', 44).text('🔑');
  nodeSel.filter(n => n.unlocks?.length).append('title').text(n => 'unlocks: ' + n.unlocks.join(', '));

  // pan / zoom
  const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const zoom = d3.zoom().scaleExtent([0.08, 3]).on('zoom', ev => {
    const overview = ev.transform.k < .34;
    drawAxes(ev.transform);
    root.attr('transform', ev.transform)
      .classed('overview', overview)
      .classed('mid', ev.transform.k >= .34 && ev.transform.k < .68);
    nodeSel.attr('tabindex', n => overview && n.progressionRole !== 'gateway' && n.progressionRole !== 'attractor' && !attractorIds.has(n.id) ? -1 : 0);
  });
  // pinned coordinate frame: stage names along the top, layer names down the left, clamped inside each lane
  const axes = d3.select('#axes');
  const topBand = axes.append('rect').attr('class', 'axisBand').attr('height', 30);
  const stageAxis = axes.selectAll('text.stageAxis').data(stages).join('text').attr('class', 'stageAxis').attr('y', 20);
  const laneAxis = axes.selectAll('text.laneAxis').data(layers).join('text').attr('class', 'laneAxis').attr('x', 10).text(L => L.replace(/_/g, ' '));
  function drawAxes(t) {
    topBand.attr('width', svg.node().clientWidth);
    // a label sticks to the left edge until the next stage pushes it off
    const x = s => Math.max(8, t.applyX(colX(s.id) + 20)), room = s => t.applyX(colX(s.id + 1) + 20) - x(s) - 16;
    stageAxis.attr('x', x).text(s => {
      const chars = Math.floor(room(s) / 7.5);
      return chars >= 12 ? trunc(`${s.id} · ${s.name}`, chars) : chars >= 1 ? String(s.id) : '';
    });
    laneAxis.attr('y', L => Math.min(t.applyY(laneY.get(L) + laneH.get(L)) - 6, Math.max(48, t.applyY(laneY.get(L)) + 16)))
      .attr('display', L => laneH.get(L) * t.k < 18 || t.applyY(laneY.get(L) + laneH.get(L)) < 48 ? 'none' : null);
  }
  svg.call(zoom);
  const move = transform => (reducedMotion ? svg : svg.transition().duration(280)).call(zoom.transform, transform);
  function fitBounds(x, yy, w, h, maxScale = 1.1) {
    const b = svg.node().getBoundingClientRect(), pad = 44;
    const k = Math.min(maxScale, (b.width - pad * 2) / w, (b.height - pad * 2) / h);
    move(d3.zoomIdentity.translate(b.width / 2 - (x + w / 2) * k, b.height / 2 - (yy + h / 2) * k).scale(k));
  }
  function focusNode(n, scale = .9) {
    const b = svg.node().getBoundingClientRect();
    move(d3.zoomIdentity.translate(b.width / 2 - n.cx * scale, b.height / 2 - n.cy * scale).scale(scale));
  }
  function fitNodes(list, maxScale = .9) {
    const x = d3.min(list, n => n.x), yy = d3.min(list, n => n.y);
    fitBounds(x, yy, d3.max(list, n => n.x + NW) - x, d3.max(list, n => n.y + NH) - yy, maxScale);
  }
  function home() {
    const k = .82;
    move(d3.zoomIdentity.translate(20 - LEFT * k, 12).scale(k));
  }
  function fitAll() { fitBounds(0, 0, totalW, totalH, 1); }
  home();

  // ---------- highlight state ----------
  let selected = null, mode = null, routeStart = null, standingStatus = ''; // mode: 'cycle' | 'path' | null
  function touching(id) { return new Set(edges.filter(e => e.source === id || e.target === id).map(e => e.id)); }
  function light(nodeIds, edgeIds) {
    nodeSel.classed('prerequisite consequence', false);
    nodeSel.classed('dim', n => !nodeIds.has(n.id) && !edgeTouches(n.id, edgeIds));
    edgeSel.classed('lit', e => edgeIds.has(e.id)).classed('dim', e => !edgeIds.has(e.id));
  }
  function edgeTouches(id, edgeIds) { return edges.some(e => edgeIds.has(e.id) && (e.source === id || e.target === id)); }
  function unlight() {
    nodeSel.classed('dim prerequisite consequence', false);
    edgeSel.classed('lit dim', false);
  }
  function select(n) {
    selected = n; mode = null; d3.select('#cycle').property('value', ''); d3.select('#cycleDesc').text('');
    nodeSel.classed('selected', m => m === n);
    const incoming = new Set(edges.filter(e => e.target === n.id).map(e => e.id));
    const outgoing = new Set(edges.filter(e => e.source === n.id).map(e => e.id));
    light(new Set([n.id]), new Set([...incoming, ...outgoing]));
    nodeSel.classed('prerequisite', m => edges.some(e => incoming.has(e.id) && e.source === m.id))
      .classed('consequence', m => edges.some(e => outgoing.has(e.id) && e.target === m.id));
    inspect(n); toggleDrawer('right', true);
  }
  function showCycle(id) {
    const c = D.cycles.find(c => c.id === id); if (!c) { mode = null; return unlight(); }
    selected = null; nodeSel.classed('selected', false); mode = 'cycle';
    const declared = c.edgeIds?.map(id => edges.find(e => e.id === id)).filter(Boolean);
    const cycleEdges = declared?.length ? declared : edges.filter(e => c.nodes.includes(e.source) && c.nodes.includes(e.target));
    const s = new Set(cycleEdges.flatMap(e => [e.source, e.target]));
    light(s, new Set(cycleEdges.map(e => e.id)));
    d3.select('#cycleDesc').text(c.description);
    toggleDrawer('right', false); if (innerWidth <= 820) toggleDrawer('left', false);
    fitNodes([...s].map(id => byId.get(id)));
  }
  function showPath(a, b) { // BFS over visible edges
    const vis = edges.filter(e => visibleEdge(e)), prev = new Map([[a.id, null]]), q = [a.id];
    while (q.length && !prev.has(b.id)) { const u = q.shift(); for (const e of vis) if (e.source === u && !prev.has(e.target)) { prev.set(e.target, e); q.push(e.target); } }
    if (!prev.has(b.id)) return status(`No directed path from ${a.label} to ${b.label} over visible edges.`);
    const ids = new Set(), ns = new Set([b.id]); for (let e = prev.get(b.id); e; e = prev.get(e.source)) { ids.add(e.id); ns.add(e.source); }
    mode = 'path'; light(ns, ids); fitNodes([...ns].map(id => byId.get(id))); status(`Path: ${[...ns].reverse().map(i => byId.get(i).label).join(' → ')}`, true);
  }
  function activateNode(n, shortcut) {
    if ((routeStart && d3.select('#route').attr('aria-pressed') === 'true') || (shortcut && selected)) {
      const start = routeStart || selected; showPath(start, n); routeStart = null; routeMode(false); return;
    }
    if (d3.select('#route').attr('aria-pressed') === 'true') {
      routeStart = n; select(n); status(`Route start: ${n.label}. Choose a destination.`, true); return;
    }
    select(n);
  }
  function routeMode(on) {
    d3.select('#route').attr('aria-pressed', on).text(on ? (routeStart ? 'Choose end' : 'Choose start') : 'Route');
    if (!on) routeStart = null;
  }
  function clear() {
    selected = null; mode = null; routeStart = null; standingStatus = ''; routeMode(false); nodeSel.classed('selected', false); unlight();
    d3.select('#cycle').property('value', ''); d3.select('#cycleDesc').text(''); status('');
  }
  d3.select('#clear').on('click', clear);
  d3.select('#route').on('click', function () { const on = this.getAttribute('aria-pressed') !== 'true'; routeMode(on); status(on ? 'Choose a route starting concept.' : 'Route mode cancelled.'); });

  // ---------- filters ----------
  const on = { edge: new Set(edgeClasses), stage: new Set([...stages.map(s => s.id), 'global']), layer: new Set(layers) };
  function checks(sel, key, items, labelFn, swatch) {
    d3.select(sel).selectAll('label').data(items).join('label').attr('class', 'f').html(v => `<input type="checkbox" checked> ${swatch ? `<span class="sw" style="border-color:${cssVar(v)}"></span>` : ''}${labelFn(v)}`)
      .select('input').on('change', (ev, v) => { ev.target.checked ? on[key].add(v) : on[key].delete(v); applyFilters(); });
  }
  checks('#edgeFilters', 'edge', edgeClasses, v => v.replace(/_/g, ' '), true);
  checks('#stageFilters', 'stage', [...stages.map(s => s.id), 'global'], v => v === 'global' ? 'global (rails)' : `${v} · ${stages[v].name}`);
  checks('#layerFilters', 'layer', layers, v => v.replace(/_/g, ' '));
  const visibleNode = n => on.layer.has(n.layer) && on.stage.has(n.stageScope === 'global' ? 'global' : n.stage);
  const visibleEdge = e => on.edge.has(e.transitionClass) && visibleNode(byId.get(e.source)) && visibleNode(byId.get(e.target));
  function applyFilters() { nodeSel.classed('hidden', n => !visibleNode(n)); edgeSel.classed('hidden', e => !visibleEdge(e)); }

  d3.select('#roleLegend').html(roles.map(r => `<div class="f"><span class="sw" style="border-color:${{ knowledge: '#4a5670', state: '#6aa4d8', gateway: cssVar('gateway'), pressure: '#d07a6a', attractor: '#c9b2ff' }[r]}"></span>${r}${r === 'gateway' ? ' 🔑' : ''}</div>`).join(''));
  d3.select('#cycle').selectAll('option.c').data(D.cycles).join('option').attr('class', 'c').attr('value', c => c.id).text(c => c.label);
  d3.select('#cycle').on('change', ev => showCycle(ev.target.value));

  // ---------- search ----------
  d3.select('#search').on('input', ev => {
    const q = ev.target.value.trim().toLowerCase();
    nodeSel.classed('match', n => q && (n.label.toLowerCase().includes(q) || n.id.includes(q)));
    nodeSel.classed('dim', n => q && !(n.label.toLowerCase().includes(q) || n.id.includes(q)));
  }).on('keydown', ev => {
    if (ev.key !== 'Enter') return;
    const q = ev.target.value.trim().toLowerCase(), n = nodes.find(n => n.label.toLowerCase().includes(q) || n.id.includes(q));
    if (n) { select(n); focusNode(n); status(`Selected ${n.label}.`, true); }
  });

  // ---------- inspector ----------
  function inspect(n) {
    const link = id => `<span class="pill" data-id="${id}">${byId.get(id)?.label ?? id}</span>`;
    const edgeRow = (e, other) => `<div>${link(other)} <span class="k">${e.transitionClass} · ${e.type}</span> <b class="${e.weight < 0 ? 'neg' : 'pos'}">${e.weight > 0 ? '+' : ''}${e.weight.toFixed(2)}</b>${e.label ? ` <span class="k">— ${e.label}</span>` : ''}</div>`;
    const inc = edges.filter(e => e.target === n.id), out = edges.filter(e => e.source === n.id);
    const fx = D.stateEffects.filter(f => f.triggerNode === n.id || [f.target.node, f.target.source, f.target.target, ...(f.target.nodes ?? [])].includes(n.id));
    const attr = D.attractors.find(a => a.node_id === n.id);
    d3.select('#inspector').style('color', null).html(`
      <h1>${n.label}</h1>
      <p class="k">${n.id} · ${n.type} · ${n.layer} · ${n.stageScope === 'global' ? 'global' : 'stage ' + n.stage} · <b>${n.progressionRole}</b>${n.attractor_strength != null ? ` · strength ${n.attractor_strength}` : ''}</p>
      <p>${n.description}</p>
      ${attr ? `<p><b>Attractor</b> · ${attr.domain}<br><span class="k">${attr.role}</span>${attr.terminal_if_rejected_for_historic_christianity ? '<br><span class="neg">terminal for historic Christianity if rejected</span>' : ''}</p>` : ''}
      ${n.prerequisites ? `<h2>Prerequisites</h2>${Object.entries(n.prerequisites).map(([k, v]) => `<p><span class="k">${k}:</span> ${v.map(link).join(' ')}</p>`).join('')}` : ''}
      ${n.unlocks?.length ? `<h2>Unlocks</h2><p>${n.unlocks.map(link).join(' ')}</p>` : ''}
      <h2>Incoming pressure (${inc.length}) · net ${d3.sum(inc, e => e.weight).toFixed(2)}</h2>${inc.map(e => edgeRow(e, e.source)).join('') || '<p class="k">none</p>'}
      <h2>Outgoing pressure (${out.length})</h2>${out.map(e => edgeRow(e, e.target)).join('') || '<p class="k">none</p>'}
      ${fx.length ? `<h2>State effects</h2>${fx.map(f => `<p><b>${f.effectType}</b> <span class="k">when ${link(f.triggerNode)} is ${f.whenStatus.join('/')}</span><br>${f.description}<br><span class="k">${JSON.stringify(f.target)} ${f.weightDelta ?? f.confidenceDelta ?? f.pressureDelta ?? f.multiplier ?? ''}</span></p>`).join('')}` : ''}
      <h2>In cycles / traces</h2><p>${D.cycles.filter(c => c.nodes.includes(n.id)).map(c => `<span class="pill" data-cycle="${c.id}">${c.label}</span>`).join(' ') || '<span class="k">none</span>'}</p>`);
    d3.select('#inspector').selectAll('.pill[data-id]').on('click', ev => { const m = byId.get(ev.target.dataset.id); select(m); focusNode(m); });
    d3.select('#inspector').selectAll('.pill[data-cycle]').on('click', ev => { d3.select('#cycle').property('value', ev.target.dataset.cycle); showCycle(ev.target.dataset.cycle); });
  }

  // ---------- command bar + keyboard ----------
  function toggleDrawer(id, open) {
    const panel = document.getElementById(id), button = document.getElementById(id === 'left' ? 'filtersToggle' : 'inspectorToggle');
    panel.classList.toggle('open', open); panel.toggleAttribute('inert', !open); panel.setAttribute('aria-hidden', !open); button.setAttribute('aria-expanded', open);
  }
  d3.select('#filtersToggle').on('click', function () { toggleDrawer('left', this.getAttribute('aria-expanded') !== 'true'); });
  d3.select('#inspectorToggle').on('click', function () { toggleDrawer('right', this.getAttribute('aria-expanded') !== 'true'); });
  d3.selectAll('[data-close]').on('click', function () { toggleDrawer(this.dataset.close, false); });
  d3.select('#home').on('click', home); d3.select('#fitAll').on('click', fitAll);
  d3.select('#fitSelection').on('click', () => selected ? focusNode(selected) : status('Select a concept first.'));
  let cameraResizeTimer;
  addEventListener('resize', () => { clearTimeout(cameraResizeTimer); cameraResizeTimer = setTimeout(() => selected ? focusNode(selected) : home(), 120); });

  function keyNode(ev, n) {
    if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); activateNode(n, ev.shiftKey); return; }
    if (ev.key === 'Escape') { clear(); return; }
    const dir = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] }[ev.key];
    if (!dir) return;
    ev.preventDefault();
    const candidates = nodes.filter(m => m !== n && visibleNode(m)).map(m => {
      const dx = m.cx - n.cx, dy = m.cy - n.cy, forward = dx * dir[0] + dy * dir[1];
      return { m, score: forward > 0 ? Math.hypot(dx, dy) + Math.abs(dx * dir[1] - dy * dir[0]) * 1.5 : Infinity };
    });
    const next = d3.min(candidates, d => d.score); const hit = candidates.find(d => d.score === next)?.m;
    if (hit) nodeSel.filter(m => m === hit).node().focus();
  }
  d3.select(document).on('keydown.clear', ev => { if (ev.key === 'Escape') { clear(); toggleDrawer('left', false); toggleDrawer('right', false); } });

  const deep = byId.get(new URLSearchParams(location.search).get('node'));
  if (deep) { select(deep); focusNode(deep); }
  function wrap(s, max, lines) { // word-boundary wrap; ellipsis only when the last line overflows
    const out = [''];
    for (const w of s.split(' ')) {
      const cur = out[out.length - 1];
      if (!cur || (cur + ' ' + w).length <= max) out[out.length - 1] = cur ? cur + ' ' + w : w;
      else out.push(w);
    }
    return out.length > lines ? [...out.slice(0, lines - 1), trunc(out.slice(lines - 1).join(' '), max)] : out.map(l => trunc(l, max));
  }
  function trunc(s, n) { return s.length > n ? s.slice(0, n - 1) + '…' : s; }
  function status(t, persist = false) { if (persist) standingStatus = t; document.getElementById('status').textContent = t; }
})();
</script>
</body>
